# The one-line description of each tool in the default MCP list (an agent pays for every character in every
# session: tests/test_mcp_surface.py holds the list under its budget). Every other tool is an openlab_tool call away.
study_new = "Scaffold a study folder (template: temporal, static or review)."
study_materialise = "Build and register the study's datasets from its recipes (`name`: one only; refresh=true reruns the recipes)."
study_run = "Run model.py sandboxed as a counted trial (the first run seals study.toml); returns the result: metrics with intervals, baselines, paired differences (a run still going after 14 min: its job id, for agent_wait)."
study_status = "The study at a glance: question, seal, datasets, trials and holdout looks used, last result."
study_runs = "The study's runs, newest first, and those in flight: audit verdict, primary metric against each baseline; every score: openlab_tool(\"study_node\", {folder, id}); act() per decision: \"study_series\"."
study_why = "What a node (e.g. a result id) rests on, oldest first."
study_amend = "Record your edit of study.toml since the seal, with the reason."
study_compare = "Compare result `a` against `b` on `metric`: paired difference, interval, p."
study_test = "Test `of` (hypothesis or claim) on `result` against `baseline` at `alpha_j`; spends alpha budget."
study_claim = "A claim: state observed (rests_on results/evidence), derived (expression over inputs {name: 'node#path'}, value), inferred (rests_on claims), hypothesized (tests) or unknown (searched). Verdict and level are computed."
study_discover = "Run the sealed [review] searches and citation hops; records sources and coverage."
study_sources = "The study's sources (status: all, unscreened, include, exclude, maybe, retracted)."
study_fetch_text = "A source's open-access full text, by page (from 1), to quote from."
study_screen = "Screen sources: decisions=[{source, decision: include|exclude|maybe, criterion, rationale, quote}]; the quote (20+ chars) must be in the source."
study_extract = "Record evidence: `quote` on `page` of a fetched source, `section`, and `fields` of the [review.extract] schema read from the quote."
study_question = "Add a question to the question tree (`part_of` a broader one)."
study_hypothesis = "Add a falsifiable hypothesis under `question`: prediction, falsified_by, tags."
study_dead_end = "Record a dropped hypothesis or approach (`of`): reason, tags, shown_by ids."
study_frontier = "What to do next, ranked by expected information per hour; each item names its verb."
study_take = "Lease a frontier item for `minutes` before acting on it."
study_replicate = "Start a study replicating a paper (arXiv id, DOI or PDF), its target and tolerance fixed before any run."
study_fidelity = "One rebuilt baseline (`arm` of result `ours`) against the paper's value (evidence `paper`)."
study_replication = "One claim of the paper (evidence `paper`) against result `ours`, gated by fidelity ids."
agent_spawn = "Delegate a sub-question to a child agent; its budget comes out of yours."
agent_request = "Ask the person for an act you can't (kind: holdout, amend, approval, budget, screen, fresh, continues, compute, instrument, instrument_run, experiment, other) or a question (kind question, args {choices, multi, other}); returns an inbox id."
agent_plan = "Report your whole plan as a new version: nodes [{id, title, kind, needs, state, links, owner}]; again whenever it changes. kind: review, data, run, branch, test, select, person, paper, critique, check, lesson, other."
agent_plan_node = "Move one plan step (planned, active, waiting, done, failed, dropped) with the record ids it rests on."
agent_inbox_item = "The state of an inbox item you filed, with the person's reason or answer."
agent_wait = "Wait for agents (ids) to end, your inbox items (inbox:7) to be answered or your runs (job:run-...) to end, mixed in one list, up to `timeout` s (300 at most)."
agent_note = "A short progress note on your timeline."
agent_reply = "Answer the person's message (prompt number `to`) in a few sentences, then carry on."
agent_comments = "The person's open comments on your study's paper draft: file, line, quote, text, replies."
agent_comment_reply = "Answer the person's comment #id on the paper draft; resolve=true once the prose is fixed."
propose_status = "Per-branch progress of the approved proposal: agents, spend, trials, hypotheses."
