[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openlab-research"
version = "1.3.0"
description = "A research framework you can trust: your coding agents run the research, openlab manages and monitors them and keeps sealed plans, point-in-time data, counted trials, person-only holdout looks and a hash-chained record."
readme = "docs/pypi.md"            # written from README.md by docs/build_docs.py
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["research", "agents", "claude-code", "codex", "reproducibility", "preregistration", "mle-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# the default install: the record, the agent control plane, the web workspace, the MCP an agent connects to, and the
# internal LaTeX engine (sympy, lark) behind derived claims and the paper's equation gate
dependencies = ["sympy>=1.13", "lark>=1.1", "pynacl>=1.5", "polars>=1.0", "numpy", "scipy", "fastapi",
                "uvicorn[standard]", "mcp>=1.0", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
study = ["scikit-learn", "mlflow", "matplotlib"]   # the runner's model registry, the templates' model, paper figures
test = ["pytest>=7", "pytest-testmon>=2", "hypothesis>=6", "httpx", "numpy"]
mirror = ["wandb"]                                  # the Weights & Biases mirror of a study's runs (openlab.study.mirror)

[project.urls]
Homepage = "https://github.com/daniel-debrun/openlab"
Documentation = "https://github.com/daniel-debrun/openlab/tree/main/docs"
Issues = "https://github.com/daniel-debrun/openlab/issues"
Changelog = "https://github.com/daniel-debrun/openlab/blob/main/CHANGELOG.md"

[project.scripts]
openlab = "openlab.__main__:main"
openlab-mcp = "openlab.mcp_server:main"

[tool.setuptools]
packages = ["openlab", "openlab.engine", "openlab.agents", "openlab.study", "openlab.study.paper", "openlab.app", "openlab.sources", "openlab.benchmark", "openlab.harness", "openlab.nodes"]

[tool.setuptools.package-data]
"openlab.study" = ["templates/**/*"]
"openlab.study.paper" = ["templates/*"]
"openlab" = ["AGENTS.md", "AGENTS_REFERENCE.md"]
"openlab.harness" = ["default/*", "default/**/*", "meta/*"]
"openlab.app" = ["static/*", "static/**/*", "show/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
